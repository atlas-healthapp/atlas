# The released version, committed so it is the same on every machine.
#
# versionCode is the number Android compares to decide what is an update. It has
# to increase on every release you distribute, or the new APK will not install
# over the old one. It is not shown to anybody.
#
# versionName is what people see. Kept as 1.0.<versionCode> so the two can never
# disagree about which build is which - a bug report naming 1.0.7 identifies
# exactly one APK.
#
# Bumped by `npm run release` (scripts/bump-version.mjs). Do not edit by hand
# unless you are correcting a mistake.
versionCode=7
versionName=1.0.7
